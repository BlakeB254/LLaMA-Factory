# CDX Platform - DeepSeek Coder LoRA SFT Configuration
# For: DeepSeek-Coder-6.7B-Instruct (GGUF - requires conversion or HF model)

### Model
# Using HuggingFace version (GGUF needs conversion)
model_name_or_path: deepseek-ai/deepseek-coder-6.7b-instruct
# Local GGUF available at: /home/codex450/cdx/resources/models/llm/deepseek
# Note: For GGUF files, use llama.cpp or convert to HF format first
trust_remote_code: true

### Method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: all

### Dataset (Code-focused)
dataset: cdx_identity,alpaca_en_demo
dataset_dir: /home/codex450/ai-tools/LLaMA-Factory/cdx/datasets
template: deepseek
cutoff_len: 8192                    # DeepSeek supports 16k context
max_samples: 10000
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 4

### Output (CDX Model Registry)
output_dir: /home/codex450/cdx/resources/models/fine-tuning/lora/deepseek-coder
logging_steps: 10
save_steps: 500
plot_loss: true
overwrite_output_dir: true
save_only_model: false
save_safetensors: true
report_to: tensorboard

### Train (DGX Spark Optimized)
per_device_train_batch_size: 2
gradient_accumulation_steps: 4
learning_rate: 2.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
flash_attn: fa2
ddp_timeout: 180000000
gradient_checkpointing: true
optim: adamw_torch
resume_from_checkpoint: null


# CDX Platform - Mistral LoRA SFT Configuration
# For: Mistral-7B-Instruct-v0.3

### Model
model_name_or_path: /home/codex450/cdx/resources/models/llm/mistral/Mistral-7B-Instruct-v0.3
# Alternative: mistralai/Mistral-7B-Instruct-v0.3 (HuggingFace)
trust_remote_code: true

### Method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: all

### Dataset
dataset: cdx_identity,alpaca_en_demo
dataset_dir: /home/codex450/ai-tools/LLaMA-Factory/cdx/datasets
template: mistral
cutoff_len: 8192                    # Mistral supports 32k context
max_samples: 10000
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 4

### Output (CDX Model Registry)
output_dir: /home/codex450/cdx/resources/models/fine-tuning/lora/mistral
logging_steps: 10
save_steps: 500
plot_loss: true
overwrite_output_dir: true
save_only_model: false
save_safetensors: true
report_to: tensorboard

### Train (DGX Spark Optimized)
per_device_train_batch_size: 2
gradient_accumulation_steps: 4
learning_rate: 2.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
flash_attn: fa2
ddp_timeout: 180000000
gradient_checkpointing: true
optim: adamw_torch
resume_from_checkpoint: null


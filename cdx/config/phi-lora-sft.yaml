# CDX Platform - Phi-3.5 LoRA SFT Configuration
# For: Phi-3.5-mini-instruct

### Model
model_name_or_path: /home/codex450/cdx/resources/models/llm/phi/Phi-3.5-mini-instruct
# Alternative: microsoft/Phi-3.5-mini-instruct (HuggingFace)
trust_remote_code: true

### Method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: all

### Dataset
dataset: cdx_identity,alpaca_en_demo
dataset_dir: /home/codex450/ai-tools/LLaMA-Factory/cdx/datasets
template: phi
cutoff_len: 4096
max_samples: 10000
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 4

### Output (CDX Model Registry)
output_dir: /home/codex450/cdx/resources/models/fine-tuning/lora/phi
logging_steps: 10
save_steps: 500
plot_loss: true
overwrite_output_dir: true
save_only_model: false
save_safetensors: true
report_to: tensorboard

### Train (DGX Spark Optimized - Phi is smaller, can use larger batch)
per_device_train_batch_size: 4
gradient_accumulation_steps: 2
learning_rate: 2.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
flash_attn: fa2
ddp_timeout: 180000000
gradient_checkpointing: true
optim: adamw_torch
resume_from_checkpoint: null


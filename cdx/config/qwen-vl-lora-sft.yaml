# CDX Platform - Qwen2.5-VL Multimodal LoRA SFT Configuration
# For: Vision-Language models (image understanding + text generation)
# Use case: Train a model to understand images AND generate text responses

### Model
model_name_or_path: Qwen/Qwen2.5-VL-7B-Instruct
# Smaller: Qwen/Qwen2.5-VL-3B-Instruct
image_max_pixels: 262144           # Max image resolution (512x512)
video_max_pixels: 16384            # For video understanding
trust_remote_code: true

### Method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target: all

### Dataset (Multimodal format with images)
dataset: mllm_demo,cdx_identity
dataset_dir: /home/codex450/ai-tools/LLaMA-Factory/cdx/datasets
template: qwen2_vl
cutoff_len: 2048
max_samples: 5000
overwrite_cache: true
preprocessing_num_workers: 16
dataloader_num_workers: 4

### Output (CDX Model Registry)
output_dir: /home/codex450/cdx/resources/models/fine-tuning/lora/qwen-vl
logging_steps: 10
save_steps: 500
plot_loss: true
overwrite_output_dir: true
save_only_model: false
save_safetensors: true
report_to: tensorboard

### Train (DGX Spark Optimized - VL models need more VRAM)
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-4
num_train_epochs: 3.0
lr_scheduler_type: cosine
warmup_ratio: 0.1
bf16: true
flash_attn: fa2
ddp_timeout: 180000000
gradient_checkpointing: true
optim: adamw_torch
resume_from_checkpoint: null

### Eval (Optional)
# val_size: 0.1
# per_device_eval_batch_size: 1
# eval_strategy: steps
# eval_steps: 500
